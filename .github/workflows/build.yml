name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Unpack project
        run: |
          unzip -q project.zip
          # Если проект распаковался в подпапку, перемещаем содержимое в корень
          SUBDIR=$(find . -maxdepth 1 -mindepth 1 -type d ! -name ".git" ! -name ".github" | head -n 1)
          if [ -n "$SUBDIR" ] && [ -f "$SUBDIR/build.gradle.kts" -o -f "$SUBDIR/build.gradle" ]; then
            mv "$SUBDIR"/* . 2>/dev/null || true
          fi

      - name: Build APK with Gradle
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-debug
          path: "**/build/outputs/apk/debug/*.apk"
