name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unpack and normalize project structure
        run: |
          if [ -f "project.zip" ]; then
            unzip -q -o project.zip
            rm project.zip
          fi

          # Находим папку, где реально лежит settings.gradle(.kts) или build.gradle(.kts)
          PROJECT_FILE=$(find . -maxdepth 3 \( -name "settings.gradle*" -o -name "build.gradle*" \) | head -n 1)
          if [ -z "$PROJECT_FILE" ]; then
            echo "::error::Файлы Gradle не найдены внутри архива!"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT_FILE")
          if [ "$PROJECT_DIR" != "." ]; then
            echo "Перенос файлов из $PROJECT_DIR в корень..."
            shopt -s dotglob
            mv "$PROJECT_DIR"/* .
            shopt -u dotglob
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle with cache
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
          cache-read-only: false

      - name: Build Debug APK
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --no-daemon --stacktrace
          else
            gradle assembleDebug --no-daemon --stacktrace
          fi

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: LibreChess-Debug-APK
          path: "**/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
          retention-days: 7
