name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Unpack and Build APK
        run: |
          echo "=== 1. Распаковка архива ==="
          for archive in *.zip *.7z *.tar.gz; do
            if [ -f "$archive" ]; then
              7z x "$archive" -y >/dev/null
            fi
          done

          GRADLE_FILE=$(find . -name "settings.gradle*" -o -name "build.gradle*" | grep -v "/app/" | head -n 1)
          PROJECT_DIR=$(dirname "$GRADLE_FILE")
          cd "$PROJECT_DIR"

          echo "=== 2. Проверка версии Gradle ==="
          # Пробуем скачать запрошенный 9.3.1, а если его нет на серверах Gradle — ставим 8.10.2 и фиксим AGP
          if wget -q --spider https://services.gradle.org/distributions/gradle-9.3.1-bin.zip; then
            echo "Скачиваем Gradle 9.3.1..."
            wget -q https://services.gradle.org/distributions/gradle-9.3.1-bin.zip -O /tmp/gradle.zip
            unzip -q -d /tmp /tmp/gradle.zip
            GRADLE_BIN="/tmp/gradle-9.3.1/bin/gradle"
          else
            echo "Gradle 9.3.1 не существует (галлюцинация ИИ). Исправляем версию AGP 9.1.1 -> 8.7.2..."
            find . -type f \( -name "*.kts" -o -name "*.toml" -o -name "*.gradle" \) -exec sed -i 's/9\.1\.1/8.7.2/g' {} +
            wget -q https://services.gradle.org/distributions/gradle-8.10.2-bin.zip -O /tmp/gradle.zip
            unzip -q -d /tmp /tmp/gradle.zip
            GRADLE_BIN="/tmp/gradle-8.10.2/bin/gradle"
          fi

          echo "=== 3. Запуск сборки APK ==="
          $GRADLE_BIN assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: LibreChess-Debug-APK
          path: "**/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
