name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Unpack and Build APK
        run: |
          echo "=== 1. Поиск и распаковка архива ==="
          ls -la
          for archive in *.zip *.7z *.tar.gz; do
            if [ -f "$archive" ]; then
              echo "Распаковка: $archive"
              7z x "$archive" -y >/dev/null
            fi
          done

          echo "=== 2. Поиск корня проекта ==="
          GRADLE_FILE=$(find . -name "settings.gradle*" -o -name "build.gradle*" | grep -v "/app/" | head -n 1)
          if [ -z "$GRADLE_FILE" ]; then
            echo "::error::В репозитории не найден ни архив с проектом, ни файлы build.gradle.kts!"
            find . -maxdepth 3
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLE_FILE")
          echo "Переход в папку проекта: $PROJECT_DIR"
          cd "$PROJECT_DIR"

          echo "=== 3. Установка Gradle 8.7 и сборка ==="
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --no-daemon --stacktrace
          else
            wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip -O /tmp/gradle.zip
            unzip -q -d /opt /tmp/gradle.zip
            /opt/gradle-8.7/bin/gradle assembleDebug --no-daemon --stacktrace
          fi

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: LibreChess-Debug-APK
          path: "**/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
