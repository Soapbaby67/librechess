name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unpack any archive
        run: |
          echo "=== Файлы в репозитории до распаковки ==="
          ls -la

          # Распаковываем все найденные архивы (.zip, .7z, .tar.gz) с любым именем
          for archive in *.zip *.7z *.tar.gz; do
            if [ -f "$archive" ]; then
              echo "Распаковка архива: $archive"
              7z x "$archive" -y >/dev/null
              rm -f "$archive"
            fi
          done

          # Ищем файл settings.gradle.kts или build.gradle.kts на любой глубине
          GRADLE_FILE=$(find . -name "settings.gradle*" -o -name "build.gradle*" | grep -v "/app/" | head -n 1)
          
          if [ -z "$GRADLE_FILE" ]; then
            echo "=== Содержимое после распаковки ==="
            find . -maxdepth 4
            echo "::error::В репозитории нет ни архива с проектом, ни файлов build.gradle.kts!"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLE_FILE")
          echo "Корень проекта найден в папке: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --no-daemon --stacktrace
          else
            gradle assembleDebug --no-daemon --stacktrace
          fi

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: LibreChess-Debug-APK
          path: "**/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
concurrency:
  
